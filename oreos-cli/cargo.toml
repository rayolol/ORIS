[workspace]

[package]
name = "oreos-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ordl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tera = "1.20.1"
toml = "1.1.2"
quote = "1.0"
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "derive"] }
prettyplease = "0.2.37"
