[workspace]
members = [
    "oreos-runtime",
    "oreos-macros",
]
exclude = [
    "oreos-cli",
]
resolver = "2"

[workspace.dependencies]
# Proc-macro and meta dependencies
syn = { version = "2.0", features = ["full", "derive"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3.5.0"
synstructure = "0.13.2"
convert_case = "0.11.0"
proc-macro-error = "1.0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
simplehash = "0.1.3"

# CLI dependencies
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tera = "1.20.1"
toml = "1.1.2"


# Embedded HAL and core
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
heapless = "0.9.2"
nb = "1.1.0"
libm = "0.2.15"

# Cortex-M
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
critical-section = "1.2.0"

# Embassy ecosystem
embassy-sync = "0.8.0"
embassy-executor = { version = "0.10.0", features = [
    "executor-thread",
    "executor-interrupt",
    "platform-cortex-m",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000", "generic-queue-8", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f103c8", "time-driver-any", "defmt"] }

# Debug and logging
defmt = "1.1.0"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Utilities
enum_dispatch = "0.3.13"
enum_delegate = "0.2.0"
fugit = "0.4.0"
maybe-async = { version = "0.2.10", features = ["is_sync"] }
static_cell = "2.1.0"
bitfields = "1.0.3"
bitbybit = "2.0.0"
arbitrary-int = "2.1.1"
crc = "3.4.0"
minicbor = { version = "2.1.1", features = ["derive"] }

# Device drivers
tmc2209 = "0.3.0"

[profile.release]
opt-level = "s"     # optimize for size — embedded
lto = true
debug = false

[profile.dev]
opt-level = 1       # light optimization even in dev — embedded is slow at 0
debug = true
